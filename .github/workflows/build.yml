name: Compilar Radio Clásica

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el zip del proyecto
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Descomprimiendo $ZIP"
          mkdir -p build_src
          unzip -q -o "$ZIP" -d build_src
          ls build_src

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: build_src/RadioClasica
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioClasica-APK
          path: build_src/RadioClasica/app/build/outputs/apk/debug/app-debug.apk
